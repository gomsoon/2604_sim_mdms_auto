<!doctype html>
<html lang="{{ current_locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t("app.title") }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('web.dashboard') }}">{{ t("app.title") }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('web.dashboard') }}">{{ t("nav.dashboard") }}</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('web.raw_reads') }}">{{ t("nav.raw_reads") }}</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('web.raw_events') }}">{{ t("nav.raw_events") }}</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('web.exceptions') }}">{{ t("nav.exceptions") }}</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('web.master_data') }}">{{ t("nav.master_data") }}</a></li>
            <li class="nav-item d-flex align-items-center ms-lg-2">
              <div class="btn-group btn-group-sm" role="group" aria-label="{{ t('nav.language') }}">
                {% for locale_code in supported_locales %}
                <a
                  class="btn btn-outline-secondary{% if locale_code == current_locale %} active{% endif %}"
                  href="{{ localized_url(locale_code) }}"
                >
                  {{ t("lang." ~ locale_code) }}
                </a>
                {% endfor %}
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
